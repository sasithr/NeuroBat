<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeuroBat — Player Information</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#3b82f6;--purple:#8b5cf6;--muted:#94a3b8}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Poppins,sans-serif;color:#fff;background:radial-gradient(circle at top right,rgba(59,130,246,.14),transparent 35%),linear-gradient(135deg,#020617,#071226)}nav{display:flex;justify-content:space-between;align-items:center;padding:18px 6%;background:rgba(15,23,42,.95);border-bottom:1px solid rgba(255,255,255,.06)}.logo{font-size:1.45rem;font-weight:700}.logo span{color:#60a5fa}.navlinks{display:flex;gap:16px}.navlinks a{color:#cbd5e1;text-decoration:none;font-size:.86rem}.wrap{max-width:900px;margin:0 auto;padding:48px 20px 70px}.intro{margin-bottom:24px}.badge{display:inline-block;padding:7px 12px;border-radius:999px;background:rgba(139,92,246,.13);border:1px solid rgba(167,139,250,.28);color:#c4b5fd;font-size:.75rem;font-weight:600}h1{font-size:clamp(2rem,4vw,3rem);margin:15px 0 8px}.sub{color:var(--muted);font-size:.9rem;line-height:1.65}.card{background:rgba(15,23,42,.92);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:30px;box-shadow:0 24px 70px rgba(0,0,0,.25)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;margin:8px 0 7px;font-size:.82rem;color:#dbeafe}.input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:#07101f;color:#fff;outline:none;font:inherit}.input:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(59,130,246,.12)}option{background:#0f172a}.btn{border:0;border-radius:10px;padding:13px 20px;margin-top:24px;background:linear-gradient(90deg,var(--blue),var(--purple));color:#fff;font:600 .95rem Poppins;cursor:pointer}.msg{display:none;margin-top:14px;padding:11px 12px;border-radius:9px;font-size:.82rem}.msg.error{display:block;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#fecaca}.msg.ok{display:block;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);color:#bbf7d0}.account{padding:14px 16px;border-radius:12px;background:rgba(2,6,23,.45);margin-bottom:20px;color:#cbd5e1;font-size:.82rem}@media(max-width:700px){.grid{grid-template-columns:1fr}.card{padding:22px}}
</style>
</head>
<body>
<nav><div class="logo">Neuro<span>Bat</span></div><div class="navlinks"><a href="/analyze-page">Analyze</a><a href="/logout">Logout</a></div></nav>
<div class="wrap"><div class="intro"><div class="badge">STEP 2 · PLAYER INFORMATION</div><h1>Build your player profile</h1><p class="sub">These details give NeuroBat useful cricket context for future personalized biomechanics analysis. We keep this first version intentionally simple.</p></div>
<section class="card"><div id="accountInfo" class="account">Loading account...</div>
<form id="profileForm"><div class="grid">
<div><label for="batting_hand">Batting hand</label><select class="input" id="batting_hand" name="batting_hand" required><option value="">Select</option><option>Right-handed</option><option>Left-handed</option></select></div>
<div><label for="player_role">Player role</label><select class="input" id="player_role" name="player_role" required><option value="">Select</option><option>Batter</option><option>Wicketkeeper-Batter</option><option>Batting All-Rounder</option><option>Bowling All-Rounder</option></select></div>
<div><label for="experience_level">Experience level</label><select class="input" id="experience_level" name="experience_level" required><option value="">Select</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option><option>Elite</option></select></div>
<div><label for="age_group">Age group <span style="color:#64748b">(optional)</span></label><select class="input" id="age_group" name="age_group"><option value="">Not specified</option><option>U13</option><option>U15</option><option>U17</option><option>U19</option><option>Adult</option></select></div>
<div style="grid-column:1/-1"><label for="team_name">Team / academy <span style="color:#64748b">(optional)</span></label><input class="input" id="team_name" name="team_name" type="text" maxlength="120" placeholder="Example: School, club or academy"></div>
</div><button id="submitBtn" class="btn" type="submit">Save Profile & Continue to Analysis</button><div id="message" class="msg"></div></form></section></div>
<script>
const form=document.getElementById('profileForm');const message=document.getElementById('message');const account=document.getElementById('accountInfo');const btn=document.getElementById('submitBtn');
async function loadProfile(){try{const res=await fetch('/api/me');if(res.status===401){window.location.href='/login';return;}const data=await res.json();account.textContent=`Signed in as ${data.user.full_name} · ${data.user.email}`;if(data.player_profile){for(const [key,value] of Object.entries(data.player_profile)){const el=document.querySelector(`[name="${key}"]`);if(el&&value!==null)el.value=value;}}}catch(e){account.textContent='Unable to load account information.';}}
form.addEventListener('submit',async(e)=>{e.preventDefault();message.className='msg';btn.disabled=true;btn.textContent='Saving profile...';try{const res=await fetch('/player-info',{method:'POST',body:new FormData(form)});const data=await res.json();if(!res.ok)throw new Error(data.error||'Could not save player profile.');message.className='msg ok';message.textContent='Player profile saved. Opening video analysis...';setTimeout(()=>{window.location.href=data.redirect||'/analyze-page';},450);}catch(err){message.className='msg error';message.textContent=err.message;}finally{btn.disabled=false;btn.textContent='Save Profile & Continue to Analysis';}});loadProfile();
</script>
</body>
</html>
